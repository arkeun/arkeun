name: Ask Gemini / OpenAI

# Claude 가 claude/ 로 시작하는 브랜치에 ai-review/request.md 를 올리면
# 제미나이(또는 OpenAI)에게 묻고, 답을 같은 브랜치의 ai-review/response.md 에 올린다.
on:
  push:
    branches: ["claude/**"]
    paths: ["ai-review/request.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ask-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ask
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 .github/scripts/ask_ai.py
      - name: Save answer
        run: |
          git config user.name "ai-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-review/response.md
          git commit -m "AI 검토 답변" || exit 0
          git push
