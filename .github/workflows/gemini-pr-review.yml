name: Gemini PR Review

# 무료 한도를 아끼려고 두 경우에만 돈다:
#  1) PR 을 처음 열었을 때
#  2) PR 댓글에 /gemini 라고 적었을 때 (/gemini 뒤에 질문을 붙여도 됨, 저장소 주인·협업자만)
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: gemini-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/gemini') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      # 검토 도구는 항상 기본 브랜치 것을 씀 (PR 쪽 코드는 실행하지 않음)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build request
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          git fetch -q origin "refs/pull/$PR/head:pr-head"
          base=$(git merge-base origin/${{ github.event.repository.default_branch }} pr-head)
          mkdir -p /tmp/ai
          git show pr-head:index.html > /tmp/ai/index.html 2>/dev/null || true
          git diff "$base" pr-head -- . ':!ai-review' | head -c 150000 > /tmp/ai/pr.diff
          extra="${COMMENT#/gemini}"
          {
            echo "id: pr-$PR"
            echo "to: gemini"
            [ -s /tmp/ai/index.html ] && echo "file: /tmp/ai/index.html"
            echo "file: /tmp/ai/pr.diff"
            echo "---"
            echo "보드게임 플레이 기록 앱 초안의 Pull Request #$PR 이에요. pr.diff 는 이번 변경, index.html 은 변경 후 전체 초안(꾸밈 CSS 생략)이에요."
            echo "이번 변경을 실제 이용자 입장과 코드 입장에서 검토해 주세요. 기능·흐름 문제, 깨진 동작, 어색한 문구를 중요한 순서로, 어디·무엇·어떻게 고칠지 짧게 적어 주세요."
            [ -n "${extra// /}" ] && echo "추가 질문: $extra"
          } > /tmp/ai/request.md
      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_REQUEST: /tmp/ai/request.md
          AI_RESPONSE: /tmp/ai/response.md
        run: python3 .github/scripts/ask_ai.py
      - name: Comment
        uses: actions/github-script@v7
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/ai/response.md', 'utf8');
            const [head, ...rest] = raw.split('\n---\n');
            const model = (head.match(/model: (.*)/) || [])[1] || '';
            const body = `## 제미나이 검토 (${model})\n\n${rest.join('\n---\n').slice(0, 60000)}\n\n---\n_의견만 드려요. 수정은 Claude가 확인 후 합니다. 다시 받으려면 댓글에 /gemini_`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR), body });
