name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # GitHub's artifact metadata can briefly lag behind a successful upload.
      # Wait before deploy-pages queries the workflow run's artifacts.
      - name: Wait for Pages artifact metadata
        run: sleep 15

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
