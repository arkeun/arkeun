<title>보드게임 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 레이아웃: 폰 폭 한 줄 앱 화면, 데스크톱에선 가운데 480px 기둥 + 하단 탭바 */
:root {

  --shelf-board: #c9b79a;
  --f-body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: var(--f-body);
  --accent-fill: var(--accent); --accent-fill-ink: var(--accent-ink);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1b201d; --sunk: #232925; --ink: #e9ece8; --ink-2: #a9b1ac; --ink-3: #8f9893;
  --line: #4a524d; --accent: #4fbf87; --accent-ink: #0d1a13; --accent-soft: #1f3a2c; --star: #f0b23a; --star-empty: #3a413c;
  --shelf-board: #5a5246; --danger: #e2685c; --heat-0: #232925; --heat-1: #24513a; --heat-2: #2f8a5c; --heat-3: #4fbf87;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35); color-scheme: dark; --accent-fill: #1f7a52; --accent-fill-ink: #fff; } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b201d; --sunk: #232925; --ink: #e9ece8; --ink-2: #a9b1ac; --ink-3: #8f9893;
  --line: #4a524d; --accent: #4fbf87; --accent-ink: #0d1a13; --accent-soft: #1f3a2c; --star: #f0b23a; --star-empty: #3a413c;
  --shelf-board: #5a5246; --danger: #e2685c; --heat-0: #232925; --heat-1: #24513a; --heat-2: #2f8a5c; --heat-3: #4fbf87;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35); color-scheme: dark; --accent-fill: #1f7a52; --accent-fill-ink: #fff; }

* { box-sizing: border-box; }

body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

.screen { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }

h2.sec { font-size: 16px; font-weight: 700; margin: 28px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; letter-spacing: -0.01em; }

/* 하단 탭바 */

/* 박스 커버 (이미지 대신) */
.cover { position: relative; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; color: #fff; max-width: 100%;

/* 홈 */

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
// 받침 있으면 '과/이랑', 없으면 '와/랑'
const hasJong = w => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 > 0; };
const wa = w => w + (hasJong(w) ? '과' : '와');
const rang = w => w + (hasJong(w) ? '이랑' : '랑');
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
function relDay(s) {
  const diff = Math.round((parse(today()) - parse(s)) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === 1) return '어제';
  if (diff < 7) return `${diff}일 전`;
  const d = parse(s);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return sameYear ? `${d.getMonth() + 1}월 ${d.getDate()}일` : `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, 720 / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7)); }; im.onerror = rej; im.src = rd.result; };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

// 같은 날 기록을 한 묶음으로
function byDay(plays) {
  const sorted = [...plays].sort((a, b) => b.date.localeCompare(a.date) || (a.at || 0) - (b.at || 0));
  const out = [];
  sorted.forEach(p => { const last = out[out.length - 1]; if (last && last.date === p.date) last.plays.push(p); else out.push({ date: p.date, plays: [p] }); });
  return out;
}
// 같은 날 커플 둘이서 한 판과 모임 판을 다른 카드로 나눔
function splitCouple(days, couples) {
  const partners = new Set((couples || []).map(c => c.partner));
  if (!partners.size) return days;
  const isC = p => p.people.length === 1 && partners.has(p.people[0]);
  return days.flatMap(d => { const c = d.plays.filter(isC), o = d.plays.filter(p => !isC(p));
    return c.length && o.length ? [{ ...d, plays: o }, { ...d, plays: c, cp: 'c' }] : [d]; });
}
// 게임마다 내 첫 플레이 id
function firstPlayIds(plays) {
  const f = {};
  [...plays].sort((a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0)).forEach(p => { if (!f[p.gameId]) f[p.gameId] = p.id; });
  return new Set(Object.values(f));
}

    const best = t.list.length ? t.list[0][1] : 0; const tier = t.list.filter(([, c]) => c === best);

// 친구가 남긴 기록: 알림만 오고 내 기록에는 이미 들어와 있음. 원하지 않으면 뺌
function applyInboxItem(s, it) {
  const t = Date.now(); let k = 0; let skipped = 0;
  const ppl = [it.from, ...it.people];
  const plays = it.games.flatMap(([id, c, w]) => {
    const mine = s.plays.filter(p => p.date === it.date && p.gameId === id && !p.from).length; // 내가 이미 적은 같은 판은 겹치지 않게
    const n = Math.max(0, c - mine); skipped += c - n;
    const gid = (bestGroup(s, ppl) || {}).id || null;
    return Array.from({ length: n }, (_, i) => ({ id: uid(), gameId: id, date: it.date, people: ppl, groupId: gid, mode: 'win', winners: Array.isArray(w[0]) ? (w[i] || []) : i === 0 ? w : [], memo: '', from: it.from, inboxId: it.id, at: t + k++ }));
  });
  return { ...s, plays: [...s.plays, ...plays], people: [...new Set([...s.people, ...ppl])], inbox: [...(s.inbox || []).filter(x => x.id !== it.id), { ...it, applied: true, added: plays.length, skipped }] };
}
function Inbox({ st, dismiss, removeFromMine }) {

        const cnt = {}; per.forEach(r => r.forEach(n => cnt[n] = (cnt[n] || 0) + 1)); const none = per.filter(r => !r.length).length;
        const ent = Object.entries(cnt).sort((a, b) => b[1] - a[1]); const bits = [...ent.slice(0, 2).map(([n, k]) => `${dn(n)} ${k}승`), ...(ent.length > 2 ? [`외 ${ent.length - 2}명`] : []), ];
        return html`<span key=${id}>${GAME[id].ko} ${c}판${bits.length ? html` · <span className="crown">${bits.join(' · ')}</span>` : ''}</span>`; })}</div>

    </div>`)}

function searchGames(q, favs) {
  const n = normName(q);
  const fav = new Set(favs || []);
  const list = n ? GAMES.filter(g => normName(g.ko).includes(n) || normName(g.en).includes(n) || (EXP[g.id] || []).some(x => normName(x[1]).includes(n) || normName(x[2]).includes(n))) : GAMES.slice();
  // 즐겨찾기 > 이름이 검색어로 시작 > 나머지
  const rank = g => (fav.has(g.id) ? 0 : 2) + (n && (normName(g.ko).startsWith(n) || normName(g.en).startsWith(n)) ? 0 : 1);
  return list.map((g, i) => [g, rank(g), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]);
}

function Shelf({ st, open, go, openBarcode, embedded, ids: idsIn, plank = true, captionOf, seg }) {

  const favs = new Set(st.favs || []);

  const xOwned = id => (EXP[id] || []).filter(x => (st.expOwned || {})[x[0]]).length;
  const stOf = id => col(id).status || 'own';
  const F = isShelf ? { all: ['전체', id => stOf(id) !== 'sold'], never: ['안 해본', id => !counts[id] && stOf(id) !== 'sold'], lent: ['빌려준', id => stOf(id) === 'lent'], hasx: ['확장 있음', id => xOwned(id) > 0 && stOf(id) !== 'sold'], sold: ['팔았음', id => stOf(id) === 'sold'] } : { all: ['전체', () => true] };
  let ids = all.filter(F[filt][1]);
  const by = {

  const box = (id, i) => { const c = col(id); const lent = stOf(id) === 'lent'; const sold = stOf(id) === 'sold'; const xn = xOwned(id); const ini = initialOf(GAME[id].ko);

/* ---------- 기록 ---------- */
function Heat({ plays }) {
  const now = new Date();
  const [off, setOff] = useState(0);
  const base = new Date(now.getFullYear(), now.getMonth() - off, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const key = `${y}-${pad(m + 1)}`;
  const per = {};
  plays.filter(p => p.date.startsWith(key)).forEach(p => per[+p.date.slice(8)] = (per[+p.date.slice(8)] || 0) + 1);
  const total = Object.values(per).reduce((a, b) => a + b, 0);
  const cells = [];
  for (let i = 0; i < base.getDay(); i++) cells.push(html`<div key=${'b' + i} className="day blank"></div>`);
  for (let d = 1; d <= days; d++) {
    const c = per[d] || 0;
    const lvl = c >= 3 ? 3 : c;
    const isToday = off === 0 && d === now.getDate();
    cells.push(html`<div key=${d} className=${`day${lvl ? ' h' + lvl : ''}${isToday ? ' today' : ''}`} title=${c ? `${m + 1}월 ${d}일 · ${c}판` : ''}>${d}</div>`);
  }
  return html`<div className="cal">
    <div className="hd"><div><b>${y !== now.getFullYear() ? y + '년 ' : ''}${m + 1}월</b> <span className="cnt">${total ? `${total}판` : '기록 없음'}</span></div>
      <div className="nav"><button aria-label="이전 달" onClick=${() => setOff(off + 1)}>${I.left}</button><button aria-label="다음 달" disabled=${off === 0} onClick=${() => setOff(Math.max(0, off - 1))}>${I.right}</button></div></div>
    <div className="grid7">${DOW.map(d => html`<div key=${d} className="dow">${d}</div>`)}${cells}</div>
  </div>`;
}

  const games = {}; together.forEach(p => games[p.gameId] = (games[p.gameId] || 0) + 1);
  return { n: together.length, last: together.map(p => p.date).sort().pop(), myWins: vs.filter(p => wonBy(p, '나')).length, theirWins: vs.filter(p => wonBy(p, name)).length, vsN: vs.length,

}

// BGG 평점 기준(1 Awful … 10 Outstanding)에 맞춘 말
const RATE_WORDS = ['', '형편없어요', '아주 별로', '다시는 안 할 듯', '별로', '그저 그래요', '할 만해요', '좋아요', '아주 좋아요', '훌륭해요', '최고예요'];
// BGG Weight와 같은 1~5 (Light · Medium Light · Medium · Medium Heavy · Heavy)
const WEIGHTS = [[1, '아주 쉬워요'], [2, '쉬운 편'], [3, '보통'], [4, '어려운 편'], [5, '아주 어려워요']];
const weightWord = w => w ? WEIGHTS[Math.min(4, Math.max(0, Math.round(w) - 1))][1] : '';
const rateTone = v => v >= 8 ? 'hi' : v >= 6 ? 'mid' : 'lo';

// 추천 점수 비중 (설정값): 취향 40, 인원 25, 난이도 15, 시간 10, 평판 5, 새로움 5
const REC_W = { taste: .40, fit: .25, weight: .15, time: .10, quality: .05, fresh: .05 };
function recommend(st, allReviews, { n, time, level, scope, onlyNew, who }) {
  const fb = st.recFb || {};
  const owned = id => { const v = st.collection[id]; return v && (v.status || 'own') !== 'sold' && v.status !== 'lent' && v.status !== 'wish'; };
  const pool = (scope === 'own' ? Object.keys(st.collection).map(Number).filter(owned) : GAMES.map(g => g.id).filter(id => scope === 'all' || !owned(id))).filter(id => GAME[id] && id > -30000 && fb[id] !== 'no');
  const whoSet = new Set(who);
  const plays = st.plays.filter(p => !p.from);
  const withThem = {}, lastDate = {}, atN = {}, everWho = {};
  plays.forEach(p => { const id = p.gameId; if (!lastDate[id] || lastDate[id] < p.date) lastDate[id] = p.date;
    if (p.people.length + 1 === n) atN[id] = (atN[id] || 0) + 1;
    const hit = p.people.filter(x => whoSet.has(x)).length; if (hit) { withThem[id] = (withThem[id] || 0) + hit; everWho[id] = true; } });
  const maxWith = Math.max(1, ...Object.values(withThem)), maxN = Math.max(1, ...Object.values(atN));
  const my = {}; st.reviews.forEach(r => my[r.gameId] = r); const conf = Math.min(1, st.reviews.length / 3);
  const pubR = {}, pubW = {}; allReviews.forEach(r => { if (r.rating) (pubR[r.gameId] = pubR[r.gameId] || []).push(r.rating); if (r.weight) (pubW[r.gameId] = pubW[r.gameId] || []).push(r.weight); });
  const avg = a => a && a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const out = [];
  pool.forEach(id => { const g = GAME[id];
    if (g.pmin != null && !(g.pmin <= n && n <= g.pmax)) return;
    if (time && g.tmin != null && g.tmin > time) return;
    if (onlyNew && (who.length ? everWho[id] : lastDate[id])) return;
    const w = avg(pubW[id]), q = avg(pubR[id]);
    const why = [];
    // 취향: 내 평점 > 같이 할 사람과 자주 한 정도 > 자료 없음(중간값)
    // 자료가 없는 항목은 null → 남은 비중으로 다시 나눔. 내 평가가 3개 미만이면 취향을 약하게 봄
    let taste = null; if (my[id] && my[id].rating) { taste = conf * my[id].rating / 10 + (1 - conf) * .5; if (my[id].rating >= 8) why.push(`${ME.name} 평점 ${my[id].rating}점`); }
    else if (withThem[id]) { taste = .5 + .5 * withThem[id] / maxWith; if (withThem[id] >= maxWith * .5) why.push('같이 자주 한 게임'); }
    const fit = g.pmin == null ? null : .7 + .3 * (atN[id] || 0) / maxN; if (atN[id] >= 3) why.push(`${n}명으로 ${atN[id]}판 해봤어요`);
    let wt = null; if (level && w) { const target = { light: 1.6, mid: 2.6, heavy: 3.8 }[level]; wt = Math.max(0, 1 - Math.abs(w - target) / 2); if (wt > .75) why.push(`난이도 ${weightWord(Math.round(w))} (${pubW[id].length}명 평가)`); }
    const tm = !time || g.tmax == null ? null : g.tmax <= time ? 1 : .6; if (time && g.tmax && g.tmax <= time) why.push(`${playtime(g)}`);
    const ql = q ? (q * pubR[id].length + 6.5 * 10) / (pubR[id].length + 10) / 10 : null; // 평가 수가 적으면 6.5점 쪽으로 당김
    const days = lastDate[id] ? (parse(today()) - parse(lastDate[id])) / 86400000 : null;
    const fresh = days == null ? 1 : Math.min(1, days / 365); if (days == null) why.push(who.length ? '같이 안 해본 게임' : '아직 안 해봤어요'); else if (days > 90) why.push(`${Math.floor(days / 30)}달째 안 했어요`);
    const parts = [['taste', taste], ['fit', fit], ['weight', wt], ['time', tm], ['quality', ql], ['fresh', fresh]].filter(([, v]) => v != null);
    const wsum = parts.reduce((a, [k]) => a + REC_W[k], 0); const score = wsum ? parts.reduce((a, [k, v]) => a + REC_W[k] * v, 0) / wsum : 0;
    out.push({ id, score, why: why.slice(0, 2), w, wn: (pubW[id] || []).length, q, qn: (pubR[id] || []).length, never: who.length ? !everWho[id] : !lastDate[id], later: fb[id] === 'later' }); });
  return out.sort((a, b) => (a.later - b.later) || b.score - a.score);
}
function WhatSheet({ st, allReviews, gid, who0, close, startPlay, update, say }) {
  const g = gid ? (st.groups || []).find(x => x.id === gid) : null;
  const lp = lastPeople(st);
  // 누구랑: 혼자 / 커플 / 이번에 같이 할 친구 여러 명 / 모임. 고른 조합은 저장하지 않음(모임이 생기지 않음)
  const opts = [['solo', '혼자', []], ...(st.couples || []).map(c => ['c:' + c.id, `♥ ${c.partner}`, [c.partner]]),
    ['last', lp.length ? `지난번 같이 한 ${lp.length}명` : null, lp], ...(g ? [['g', g.name, g.members]] : [])].filter(o => o[1]);
  const [who, setWho] = useState(who0 || (g ? g.members : lp));
  const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const freqP = useMemo(() => { const f = {}; st.plays.forEach(p => p.people.forEach(x => f[x] = (f[x] || 0) + 1)); return Object.entries(f).sort((a, b) => b[1] - a[1]).map(x => x[0]); }, [st.plays]);
  const [pickPpl, setPickPpl] = useState(false);
  const whoK = who.join('|');
  const [n, setN] = useState(Math.max(1, Math.min(8, (who0 || (g ? g.members : lp)).length + 1)));
  const setWhoN = w => { setWho(w); setN(Math.max(1, Math.min(8, w.length + 1))); setPick(null); };
  const [time, setTime] = useState(0); const [level, setLevel] = useState(''); const [scope, setScope] = useState('own'); const [onlyNew, setOnlyNew] = useState(false); const [more, setMore] = useState(false);
  const [pick, setPick] = useState(null);
  const list = useMemo(() => recommend(st, allReviews, { n, time, level, scope, onlyNew, who }), [st.plays, st.collection, st.reviews, st.recFb, n, time, level, scope, onlyNew, whoK]);
  const fb = (id, v) => { update(s => ({ ...s, recFb: { ...(s.recFb || {}), [id]: v } })); if (pick === id) setPick(null); say(v === 'no' ? `${GAME[id].ko}은(는) 추천에서 뺐어요` : '나중에 볼게요'); };
  const roll = () => { if (!list.length) return; const top = list.slice(0, Math.min(5, list.length)); let k; do { k = top[Math.floor(Math.random() * top.length)].id; } while (top.length > 1 && k === pick); setPick(k); };
  const pk = pick && list.find(x => x.id === pick);
  return html`<${Sheet} title="오늘 뭐 할까?" close=${close}>
    <div className="field" style=${{ marginTop: 8 }}><span className="lb">누구랑?</span>
      <div className="dates">${opts.map(([k, l, ppl]) => html`<button key=${k} className="pill sm" aria-pressed=${same(who, ppl)} onClick=${() => setWhoN(ppl)}>${l}</button>`)}
        <button className="pill sm" aria-pressed=${pickPpl} onClick=${() => setPickPpl(!pickPpl)}>친구 고르기</button></div>
      ${pickPpl ? html`<div className="dates whopick">${freqP.slice(0, 24).map(x => html`<button key=${x} className="pill sm" aria-pressed=${who.includes(x)} onClick=${() => setWhoN(who.includes(x) ? who.filter(y => y !== x) : [...who, x])}>${x}</button>`)}</div>` : null}
      ${who.length ? html`<div className="hint">${[...who.slice(0, 4), ME.name].join(', ')}${who.length > 4 ? ` 외 ${who.length - 4}명` : ''} · 모두 ${who.length + 1}명</div>` : null}</div>
    <div className="field"><span className="lb">몇 명?</span>
      <div className="dates">${[1, 2, 3, 4, 5, 6, 7, 8].map(k => html`<button key=${k} className="pill sm" aria-pressed=${n === k} onClick=${() => setN(k)}>${k}명</button>`)}</div></div>
    <div className="field"><span className="lb">어디서 고를까?</span><div className="dates">
      ${[['own', `${ME.name} 보관함`], ['new', '안 가진 게임'], ['all', '전체']].map(([k, l]) => html`<button key=${k} className="pill sm" aria-pressed=${scope === k} onClick=${() => { setScope(k); setPick(null); }}>${l}</button>`)}
      <button className="pill sm" aria-pressed=${onlyNew} onClick=${() => setOnlyNew(!onlyNew)}>안 해본 것만</button></div></div>
    ${!more ? html`<button className="linkbtn" onClick=${() => setMore(true)}>시간·난이도 고르기</button>` : html`
    <div className="field"><span className="lb">시간은?</span>
      <div className="dates">${[[0, '상관없어요'], [30, '30분 안쪽'], [60, '1시간'], [120, '2시간']].map(([k, l]) => html`<button key=${k} className="pill sm" aria-pressed=${time === k} onClick=${() => setTime(k)}>${l}</button>`)}</div></div>
    <div className="field"><span className="lb">무게는?</span>
      <div className="dates">${[['', '상관없어요'], ['light', '가볍게'], ['mid', '적당히'], ['heavy', '무겁게']].map(([k, l]) => html`<button key=${k} className="pill sm" aria-pressed=${level === k} onClick=${() => setLevel(k)}>${l}</button>`)}</div></div>`}
    ${pk ? html`<div className="pickcard"><${Cover} g=${GAME[pick]}/><div><div className="t">${GAME[pick].ko}</div><div className="d">${players(GAME[pick])} · ${playtime(GAME[pick])}${pk.w ? ` · 난이도 ${weightWord(Math.round(pk.w))}` : ''}${pk.q ? ` · 앱 평가 ${pk.q.toFixed(1)} (${pk.qn}명)` : ''}</div>
      <div className="d why">${pk.why.length ? pk.why.join(' · ') : `${n}명이 할 수 있고 조건에 맞는 게임이에요`}</div>
      <div className="r"><button className="btn primary" onClick=${() => { update(s => ({ ...s, recFb: { ...(s.recFb || {}), [pick]: 'played' } })); close(); startPlay(pick); }}>이걸로 기록하기</button></div>
      <div className="r2"><button className="linkbtn muted" onClick=${() => fb(pick, 'later')}>나중에</button><button className="linkbtn muted" onClick=${() => fb(pick, 'no')}>관심 없음</button></div></div></div>` : null}
    <button className="btn block" style=${{ marginTop: 12 }} disabled=${!list.length} onClick=${roll}>${pick ? '다시 뽑기' : '하나 골라줘'}</button>
    ${!list.length ? html`<div className="note">조건에 맞는 게임이 없어요. 인원이나 시간을 바꾸거나, "안 가진 게임"에서 찾아보세요.</div>` : (() => {
      // 한 가지 순서로만 보여 주지 않고: 잘 맞는 것 / 새로 해볼 것 / 짧게 할 것을 섞어서
      const used = new Set(); const take = (arr, k) => arr.filter(x => !used.has(x.id)).slice(0, k).map(x => (used.add(x.id), x));
      const fit = take(list, 3); const fresh = take(list.filter(x => x.never), 2); const quick = take(list.filter(x => GAME[x.id].tmax && GAME[x.id].tmax <= 30), 2);
      const row = (x, side) => html`<${GameRow} key=${x.id} g=${GAME[x.id]} onOpen=${() => setPick(x.id)} side=${side || x.why[0] || '조건에 맞아요'}/>`;
      return html`<h2 className="sec">${who.length ? '같이 하기 좋은 게임' : '잘 맞을 게임'}</h2>${fit.map(x => row(x))}
        ${fresh.length ? html`<h2 className="sec">새로 해볼 만한 게임</h2>${fresh.map(x => row(x, who.length ? '같이 안 해봄' : '아직 안 해봄'))}` : null}
        ${quick.length ? html`<h2 className="sec">짧게 한 판</h2>${quick.map(x => row(x, playtime(GAME[x.id])))}` : null}
        ${list.length > used.size ? html`<details className="recall"><summary>조건에 맞는 게임 전부 ${list.length}개</summary>${list.filter(x => !used.has(x.id)).slice(0, 40).map(x => row(x))}</details>` : null}`; })()}
    ${who.length && !st.reviews.length ? html`<div className="note">같이 할 사람들 평가가 아직 없어서, 인원·시간과 같이 한 기록으로만 골랐어요. 취향을 안다고 하지는 않을게요.</div>` : null}
    <div className="note">${ME.name}님 평점, 같이 한 기록, 앱 이용자 평가로 순서를 정해요. 자료가 없는 항목은 빼고 계산해요. BGG 평점·난이도는 연동되면 따로 보여 드려요.</div>
  <//>`;
}

/* ---------- 하루 요약 카드 ---------- */
function ShareDaySheet({ st, date, close, say }) {
  const ps = st.plays.filter(p => p.date === date);
  const d = parse(date);
  const games = []; ps.forEach(p => { let x = games.find(y => y.id === p.gameId); if (!x) { x = { id: p.gameId, n: 0, w: {} }; games.push(x); } x.n++; (modeOf(p) === 'coop' ? (p.coop ? [p.coop === 'win' ? '__cw' : '__cl'] : []) : modeOf(p) === 'rank' ? Object.keys(p.ranks || {}).filter(k => p.ranks[k] === 1) : p.winners || []).forEach(n => x.w[n] = (x.w[n] || 0) + 1); });
  const people = [...new Set(ps.flatMap(p => p.people))];
  const wins = {}; ps.forEach(p => [...(modeOf(p) === 'rank' ? Object.keys(p.ranks || {}).filter(k => p.ranks[k] === 1) : modeOf(p) === 'win' ? p.winners || [] : [])].forEach(n => wins[n] = (wins[n] || 0) + 1));
  const mvp = Object.entries(wins).sort((a, b) => b[1] - a[1])[0];
  const photo = ((st.photos || {})[date] || []).find(m => typeof m === 'string');
  const text = `${d.getMonth() + 1}월 ${d.getDate()}일 보드게임\n` + games.map(x => `${GAME[x.id].ko}${Object.keys(x.w).length ? ' (' + wtxt(x) + ')' : ''}`).join('\n') + (mvp ? `\n오늘의 승자: ${mvp[0] === '나' ? st.me : mvp[0]} ${mvp[1]}승` : '');
  function wtxt(x) { const e = Object.entries(x.w); const cw = x.w.__cw || 0, cl = x.w.__cl || 0;
    if (cw || cl) return cw + cl === 1 ? (cw ? '우리가 이김' : '우리가 짐') : `우리가 ${cw}승 ${cl}패`;
    return e.sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${k === '나' ? st.me : k} ${v}승`).join(', ') + (e.length > 3 ? ' 외' : ''); }
  const share = async () => { try { if (navigator.share) { await navigator.share({ text }); return; } await navigator.clipboard.writeText(text); say('요약을 복사했어요. 단톡방에 붙여넣으면 돼요'); } catch (e) { say('복사가 막혀 있어요. 카드를 길게 눌러 캡처해 주세요'); } };
  return html`<${Sheet} title="하루 요약" close=${close}>
    <div className="daycard">
      ${photo ? html`<img src=${photo} alt="그날 사진"/>` : null}
      <div className="dc-hd"><span className="dc-d">${d.getMonth() + 1}월 ${d.getDate()}일</span><span>${DOW[d.getDay()]}요일</span></div>
      <div className="dc-who">${[st.me, ...people].slice(0, 8).join(' · ')}${people.length > 7 ? ` 외 ${people.length - 7}명` : ''}</div>
      ${games.sort((a, b) => b.n - a.n).slice(0, 6).map(x => html`<div key=${x.id} className="dc-g"><span>${GAME[x.id].ko}</span><span></span>
        <span className="w">${wtxt(x)}</span></div>`)}
      ${games.length > 6 ? html`<div className="dc-g more"><span>외 ${games.length - 6}개 게임</span><span></span><span></span></div>` : null}
      ${mvp ? html`<div className="dc-mvp">오늘의 승자 <b>${mvp[0] === '나' ? st.me : mvp[0]}</b> ${mvp[1]}승</div>` : null}
      <div className="dc-foot">보드게임 기록장</div>
    </div>
    <div className="sheet-foot"><button className="btn primary" onClick=${share}>공유하기</button></div>
    <div className="note">카카오톡 같은 앱으로 바로 보내요.</div>
  <//>`;
}

/* ---------- 연말 결산 ---------- */
function YearSheet({ st, close, open }) {
  const y = String(new Date().getFullYear());
  const ps = st.plays.filter(p => p.date.startsWith(y));
  const days = new Set(ps.map(p => p.date)).size;
  const cnt = {}; ps.forEach(p => cnt[p.gameId] = (cnt[p.gameId] || 0) + 1);
  const topG = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const mates = {}; ps.forEach(p => p.people.forEach(n => mates[n] = (mates[n] || 0) + 1));
  const topM = Object.entries(mates).sort((a, b) => b[1] - a[1])[0];
  const firsts = firstPlayIds(st.plays); const newG = ps.filter(p => firsts.has(p.id)).length;
  const mins = ps.reduce((s, p) => s + (Number(p.minutes) || 0), 0);
  const per = Array(12).fill(0); ps.forEach(p => per[+p.date.slice(5, 7) - 1]++); const mx = Math.max(1, ...per);
  const vs = ps.filter(p => p.people.length && modeOf(p) !== 'coop' && decided(p)); const w = vs.filter(p => wonBy(p, '나')).length;
  const best = topG.map(([id]) => { const d = vs.filter(p => p.gameId == id); return [id, d.length, d.filter(p => wonBy(p, '나')).length]; }).filter(x => x[1] >= 2).sort((a, b) => b[2] / b[1] - a[2] / a[1])[0];
  const riv = rivalOf(ps, '나', [...new Set(ps.flatMap(p => p.people))]);
  const grpRank = (st.groups || []).map(g => [g, new Set(ps.filter(p => inGroup(p, g)).map(p => p.date)).size]).filter(x => x[1]).sort((a, b) => b[1] - a[1]); const topGrp = grpRank[0];
  return html`<${Sheet} title=${`${y} 결산`} close=${close}>
    <div className="yr-big"><b className="num">${ps.length}</b>판 <span>· ${days}일 모였어요</span></div>
    <div className="yr-bars">${per.map((c, i) => html`<div key=${i}><i style=${{ height: `${c / mx * 100}%` }}></i><span>${i + 1}</span></div>`)}</div>
    <div className="yr-grid">
      ${topG[0] ? html`<button className="yr-c" onClick=${() => { close(); open(+topG[0][0]); }}><span>제일 많이 한 게임</span><b>${GAME[topG[0][0]].ko}</b><em>${topG[0][1]}판</em></button>` : null}
      ${topM ? html`<div className="yr-c"><span>제일 많이 같이 한 사람</span><b>${topM[0]}</b><em>${topM[1]}판</em></div>` : null}
      <div className="yr-c"><span>올해 해본 게임</span><b>${topG.length}개</b><em>처음 해본 게임 ${newG}개</em></div>
      ${vs.length ? html`<div className="yr-c"><span>승률</span><b>${pct(w, vs.length)}</b><em>${vs.length}판 중 ${w}승</em></div>` : null}
      ${best ? html`<div className="yr-c"><span>제일 잘한 게임</span><b>${GAME[best[0]].ko}</b><em>${best[1]}판 ${best[2]}승</em></div>` : null}
      ${topGrp && topGrp[1] ? html`<div className="yr-c"><span>제일 자주 모인 모임</span><b>${topGrp[0].name}</b><em>${topGrp[1]}번 모임${grpRank.length > 1 ? ` · 올해 모인 모임 ${grpRank.length}개` : ''}</em></div>` : null}
      ${riv ? html`<div className="yr-c"><span>올해의 라이벌</span><b>${riv.n}</b><em>${riv.a} : ${riv.b}</em></div>` : null}
    </div>
    <div className="note">12월이 되면 홈에 결산이 떠요. 지금은 올해 기록으로 미리 보여줘요.</div>
  <//>`;
}

/* ---------- 바코드로 담기 ---------- */

function ShelfImageSheet({ st, close, say }) {
  const [size, setSize] = useState('feed'); const [dark, setDark] = useState(false); const [url, setUrl] = useState(null);
  const counts = useMemo(() => { const o = {}; st.plays.forEach(p => o[p.gameId] = (o[p.gameId] || 0) + 1); return o; }, [st.plays]);
  const ids = Object.keys(st.collection).map(Number).filter(id => GAME[id] && id > -30000 && (st.collection[id].status || 'own') !== 'sold').sort((a, b) => (counts[b] || 0) - (counts[a] || 0)).slice(0, 9);
  const rows = Math.max(1, Math.ceil(ids.length / 3));
  const all = Object.keys(st.collection).filter(id => GAME[id]).length;
  const firstY = (() => { const ys = Object.values(st.collection).map(v => (v.bought || v.at || '').slice(0, 4)).filter(Boolean).sort(); return ys[0] || (st.since || today()).slice(0, 4); })();
  useEffect(() => {
    const W = 1080, H = size === 'feed' ? 1350 : 1920; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
    const bg = dark ? '#23262a' : '#f4efe6', ink = dark ? '#f2efe9' : '#22201c', sub = dark ? '#a9a49b' : '#7a7368', board = dark ? '#6b5a43' : '#c8b08c';
    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    const font = '"Pretendard", "Noto Sans KR", sans-serif';
    const top = size === 'feed' ? 120 : 260;
    x.fillStyle = ink; x.font = `800 84px ${font}`; x.fillText(`${st.me}의 선반`, 90, top + 70);
    x.fillStyle = sub; x.font = `500 38px ${font}`; x.fillText(`${all}개 · ${firstY}년부터`, 90, top + 130);
    const rowsTop = top + 210, rowsH = (size === 'feed' ? 1180 : 1640) - rowsTop, rowH = rowsH / Math.max(rows, 2);
    const colW = (W - 180) / 3;
    for (let r = 0; r < rows; r++) { const base = rowsTop + rowH * (r + 1) - 30;
      ids.slice(r * 3, r * 3 + 3).forEach((id, k) => { const rt = boxRatio(id); const maxH = rowH - 50; const bw = Math.min(colW - 40, maxH / 1.28) * (rt < 1 ? 1.08 : 1), bh = bw * rt; const bx = 90 + k * colW + (colW - bw) / 2, by = base - bh;
        x.save(); x.shadowColor = 'rgba(0,0,0,.28)'; x.shadowBlur = 24; x.shadowOffsetY = 10; x.fillStyle = COVER_COLORS[hash(id) % COVER_COLORS.length]; x.fillRect(bx, by, bw, bh); x.restore();
        x.fillStyle = '#fff'; x.font = `700 34px ${font}`; x.textAlign = 'center';
        const words = GAME[id].ko.split(' '); const lines = []; let cur = ''; words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > bw - 30 && cur) { lines.push(cur); cur = w; } else cur = t; }); lines.push(cur);
        lines.slice(0, 3).forEach((ln, i) => x.fillText(ln, bx + bw / 2, by + bh - 40 - (lines.length - 1 - i) * 42)); x.textAlign = 'left'; });
      x.fillStyle = board; x.fillRect(60, base, W - 120, 16); x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(60, base + 16, W - 120, 8); }
    x.fillStyle = sub; x.font = `500 28px ${font}`; x.textAlign = 'right'; x.fillText('보드게임 기록장', W - 90, H - 70); x.textAlign = 'left';
    setUrl(cv.toDataURL('image/png'));
  }, [size, dark]);
  const shareIt = async () => { try { const blob = await (await fetch(url)).blob(); const f = new File([blob], 'shelf.png', { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (e) {} say('이 브라우저는 바로 공유가 안 돼요. 저장한 뒤 올려 주세요'); };
  return html`<${Sheet} title="선반 이미지" close=${close}>
    <div className="seg" role="group" aria-label="크기" style=${{ marginBottom: 8 }}><button aria-pressed=${size === 'feed'} onClick=${() => setSize('feed')}>피드 4:5</button><button aria-pressed=${size === 'story'} onClick=${() => setSize('story')}>스토리 9:16</button></div>
    <div className="seg" role="group" aria-label="바탕" style=${{ marginBottom: 12, marginLeft: 8 }}><button aria-pressed=${!dark} onClick=${() => setDark(false)}>종이</button><button aria-pressed=${dark} onClick=${() => setDark(true)}>어두운</button></div>
    <div className="shimg">${url ? html`<img src=${url} alt="선반 이미지 미리보기"/>` : null}</div>
    <div className="hint" style=${{ marginTop: 6 }}>많이 한 게임이 9개까지 올라가요.</div>
    <div className="sheet-foot"><button className="btn primary" disabled=${!url} onClick=${async () => { const blob = await (await fetch(url)).blob(); saveFile(`${st.me}-선반.png`, blob, say); }}>저장</button><button className="btn" onClick=${shareIt}>공유</button></div>
  <//>`;
}

// 모임이 수십 개일 때: 고정한 모임 + 최근에 같이 한 모임이 먼저, 나머지는 검색
const _glast = new WeakMap();
const groupLast = (st, g) => { let o = _glast.get(st.plays); if (!o) { o = {}; st.plays.forEach(p => { if (p.groupId && (!o[p.groupId] || o[p.groupId] < p.date)) o[p.groupId] = p.date; }); _glast.set(st.plays, o); } return o[g.id] || ''; };
function groupsOrdered(st) {
  const gs = st.groups || [];
  const last = Object.fromEntries(gs.map(g => [g.id, groupLast(st, g)]));
  return [...gs].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || last[b.id].localeCompare(last[a.id]));
}
// 하루 머리줄용: 판마다 사람이 제일 많이 겹치는 모임 하나(같으면 작은 모임)
function dayGroupNames(st, plays) {
  const ids = [...new Set(plays.map(p => p.groupId).filter(Boolean))];
  return ids.map(id => (st.groups || []).find(g => g.id === id)).filter(Boolean).map(g => g.name);
}
function groupsOfDay(st, plays) { return (st.groups || []).filter(g => plays.some(p => inGroup(p, g))); }

function RunningTimer({ draft, onOpen }) {
  const [, tick] = useState(0);
  const run = [];
  (draft && draft.items || []).forEach(it => it.rounds.forEach((r, i) => { if (r.timerStart) run.push([it.gameId, i, r.timerStart]); }));
  useEffect(() => { if (!run.length) return; const t = setInterval(() => tick(x => x + 1), 15000); return () => clearInterval(t); }, [run.length]);
  if (!run.length) return null;
  const [gid, i, t0] = run[0];
  const g = GAME[gid]; const m = Math.max(0, Math.floor((Date.now() - t0) / 60000));
  const many = draft.items.find(it => it.gameId === gid).rounds.length > 1;
  return html`<button className="runbar" onClick=${onOpen}><span className="dot"></span><span className="t">${g ? g.ko : '게임'}${many ? ` ${i + 1}판` : ''} ${m ? `${m}분째` : '방금 시작'}</span>${run.length > 1 ? html`<span className="x">외 ${run.length - 1}개</span>` : null}<span className="go">돌아가기</span></button>`;
}

  const visitEv = e => { const had = (st.visitEv || {})[e.id]; update(s => { const v = { ...(s.visitEv || {}) }; if (had) delete v[e.id]; else v[e.id] = true; return { ...s, visitEv: v }; }); say(had ? '신청을 취소했어요' : '이 일정만 신청했어요 · 모임 가입은 안 돼요'); };

  const saveGroupInfo = (id, info) => { update(s => ({ ...s, groups: s.groups.map(g => g.id === id ? { ...g, ...info } : g) })); setSheet(null); say('모임 정보를 고쳤어요'); };
  const openCouple = id => { setStack(s => ({ ...s, [tab]: 'c:' + id })); window.scrollTo(0, 0); };
  const editCouple = c => setSheet({ kind: 'couple', c });
  const upCouple = (id, fn, msg) => { update(s => ({ ...s, couples: s.couples.map(x => x.id === id ? fn(x) : x) })); if (msg) say(msg); };
  const updCouple = (id, patch) => { update(s => ({ ...s, couples: s.couples.map(x => x.id === id ? { ...x, ...patch } : x) })); say('사진을 넣었어요'); };
  const saveCouple = c => { const had = (st.couples || []).some(x => x.id === c.id); update(s => ({ ...s, couples: had ? s.couples.map(x => x.id === c.id ? c : x) : [...(s.couples || []), c] })); setSheet(null);
    if (!had) { openCouple(c.id); say('커플을 만들었어요'); } else say('저장했어요'); };
  const delCouple = id => { update(s => ({ ...s, couples: s.couples.filter(x => x.id !== id) })); setSheet(null); back(); say('커플을 끊었어요. 기록은 그대로 있어요'); };
  const pickWhat = gid => setSheet({ kind: 'what', gid });
  const shareDay = d => setSheet({ kind: 'share', date: d });
  const openYear = () => setSheet({ kind: 'year' });
  const openBarcode = () => setSheet({ kind: 'barcode' });
  const saveDraft = d => setSt(s => (JSON.stringify(s.draft) === JSON.stringify(d) ? s : { ...s, draft: d }));
  const discardDraft = () => { setSt(s => ({ ...s, draft: null })); setSheet(null); say('적던 기록을 버렸어요'); };
  const toggleExp = xid => { const had = !!(st.expOwned || {})[xid]; update(s => { const e = { ...(s.expOwned || {}) }; if (had) delete e[xid]; else e[xid] = true; return { ...s, expOwned: e }; }); const w = XP[xid].ko + (hasJong(XP[xid].ko) ? '을' : '를'); say(had ? `${w} 보관함에서 뺐어요` : `${w} 보관함에 담았어요`); };
  const toggleFav = id => { const had = (st.favs || []).includes(id); update(s => ({ ...s, favs: had ? s.favs.filter(x => x !== id) : [id, ...(s.favs || [])] })); say(had ? '즐겨찾기에서 뺐어요' : '즐겨찾기에 넣었어요 · 기록할 때 맨 앞에 나와요'); };
  const startReview = id => setSheet({ kind: 'review', id });
  const detail = stack[tab];
  const editDay = d => setSheet({ kind: 'play', edit: d });
  const openPerson = n => setSheet({ kind: 'person', name: n });
  const [hq, setHq] = useState('');
  NAV.log = q => { setSheet(null); setHq(q); setStack(s => ({ ...s, home: null })); setTab('home'); try { history.replaceState(null, '', '#home'); } catch (e) {} window.scrollTo(0, 0); };
  NAV.person = openPerson;
  NAV.what = who => setSheet({ kind: 'what', who });
  NAV.day = d => setSheet({ kind: 'day', date: d });
  NAV.play = () => startPlay(null);
  NAV.share = d => shareDay(d);
  NAV.settings = () => openSettings();
  NAV.couple = (id, t) => { NAV.cTab = t || null; setSheet(null); openCouple(id); };
  NAV.qna = id => setQnaG(id);
  ME.name = st.me || '나';
  const setRule = (id, k) => update(s => ({ ...s, scoreRule: { ...(s.scoreRule || {}), [id]: k } }));
  const openGroups = () => { setStack(s => ({ ...s, [tab]: 'gl' })); window.scrollTo(0, 0); };
  const pinGroup = id => { const g = st.groups.find(x => x.id === id); update(s => ({ ...s, groups: s.groups.map(x => x.id === id ? { ...x, pinned: !x.pinned } : x) })); say(g.pinned ? '고정을 풀었어요' : '맨 앞에 고정했어요'); };
  const hideGroupHome = id => { const g = st.groups.find(x => x.id === id); update(s => ({ ...s, groups: s.groups.map(x => x.id === id ? { ...x, hideHome: !x.hideHome } : x) })); say(g.hideHome ? '홈에 다시 보여요' : '홈 소식에서 숨겼어요. 모임 화면에선 그대로 보여요'); };
  const muteGroup = id => { const g = st.groups.find(x => x.id === id); update(s => ({ ...s, groups: s.groups.map(x => x.id === id ? { ...x, mute: !x.mute } : x) })); say(g.mute ? '이 모임 알림을 켰어요' : '이 모임 알림을 껐어요. 기록은 그대로 모여요'); };
  const openChar = () => setSheet({ kind: 'char' });
  const saveChar = ch => { update(s => ({ ...s, myChar: ch })); setSheet(null); say('캐릭터를 바꿨어요'); };
  const cm = {
    add: (rid, text) => update(s => ({ ...s, comments: { ...(s.comments || {}), [rid]: [...((s.comments || {})[rid] || []), { id: uid(), author: 'me', text, date: today() }] } })),
    del: (rid, cid) => { update(s => ({ ...s, comments: { ...s.comments, [rid]: s.comments[rid].filter(c => c.id !== cid) } })); say('댓글을 지웠어요'); },
    hide: (c, report) => { update(s => ({ ...s, hiddenComments: { ...(s.hiddenComments || {}), [c.id]: report ? 'report' : 'hide' } })); say(report ? '신고했어요. 이 댓글은 이제 안 보여요' : '댓글을 숨겼어요'); },
    block: n => { update(s => { const f = { ...s.friends }; delete f[n]; return { ...s, friends: f, blocked: { ...(s.blocked || {}), [n]: true } }; }); say(`${n}님을 차단했어요. 이 사람 댓글과 평가가 안 보여요`); },
    read: rid => update(s => (s.comments || {})[rid] && s.comments[rid].some(c => c.unread) ? { ...s, comments: { ...s.comments, [rid]: s.comments[rid].map(c => ({ ...c, unread: false })) } } : s),
  };
  const openSettings = () => setSheet({ kind: 'settings' });
  const upGroup = (id, fn) => update(s => ({ ...s, groups: s.groups.map(g => g.id === id ? fn(g) : g) }));
  const toggleWish = id => { const had = (st.wish || []).includes(id); update(s => ({ ...s, wish: had ? s.wish.filter(x => x !== id) : [id, ...(s.wish || [])] })); say(had ? '사고 싶은 목록에서 뺐어요' : '사고 싶은 목록에 담았어요'); };
  const openShelfImg = () => setSheet({ kind: 'shelfimg' });
  const qa = (gid, fn) => update(s => ({ ...s, qna: { ...(s.qna || {}), [gid]: fn(qnaOf(s, gid)) } }));
  const props = { upCouple, qa, st, allReviews, open, startPlay, startReview, go, dismiss, removeFromMine, editDay, openPerson, removeFromId, hideReview, setShelfInfo, openSettings, shareDay, openGroup, newGroup, pickWhat, openYear, openBarcode, leaveGroup, inviteToGroup, say, openCouple, editCouple, openChar, cm, openGroups, pinGroup, muteGroup, hideGroupHome, upGroup, editGroup, openPub, toggleSaveGroup, setMyArea, toggleWish, openShelfImg, updCouple };

  let screen;
  if (detail === 'gl') screen = html`<${GroupsList} ...${props} back=${back}/>`;
  else if (typeof detail === 'string' && detail.startsWith('c:')) screen = html`<${CoupleScreen} key=${detail} cid=${detail.slice(2)} ...${props} back=${back}/>`;
  else if (typeof detail === 'string' && detail.startsWith('gp:')) { const pid = detail.slice(3); const mineG = (st.groups || []).find(g => g.id === pid); const p = mineG || pubGroups(st).find(g => g.id === pid);
    screen = mineG ? html`<${GroupScreen} key=${'g:' + pid} gid=${pid} ...${props} back=${back}/>` : p ? html`<${GroupIntro} key=${detail} g=${p} st=${st} back=${back} open=${open} say=${say} saved=${(st.savedGroups || []).includes(pid)} toggleSave=${() => toggleSaveGroup(pid)}
      req=${(st.joinReq || {})[pid]} onJoin=${() => joinPub(p)} onAsk=${ans => askPub(p, ans)} onCancelAsk=${() => cancelAsk(pid)} visit=${st.visitEv || {}} onVisit=${visitEv}/>` : html`<div className="screen"><button className="backbtn" onClick=${back}>${I.back}뒤로</button><${Empty} title="모임이 없어요">없어진 모임이에요.<//></div>`; }
  else if (typeof detail === 'string' && detail.startsWith('g:')) screen = html`<${GroupScreen} key=${detail} gid=${detail.slice(2)} ...${props} back=${back}/>`;
  else if (detail) screen = html`<${Detail} key=${detail} id=${detail} ...${props} back=${back} toggleOwn=${toggleOwn} toggleFav=${toggleFav} toggleExp=${toggleExp}/>`;
  else if (tab === 'home') screen = html`<${Home} ...${props} hq=${hq} setHq=${setHq}/>`;
  else if (tab === 'games') screen = html`<${Games} ...${props} q=${q} setQ=${setQ}/>`;
  else if (tab === 'groups') screen = html`<${GroupsList} ...${props} back=${null}/>`;
  else screen = html`<${Me} ...${props} update=${update} resetTo=${resetTo}/>`;

  if (st.firstRun) return html`<${Welcome} start=${(kind, nick) => { if (kind === 'sample') { const s0 = seedState(); setSt(prepState(nick ? { ...s0, me: nick } : s0)); } else setSt(prepState({ ...empty(), me: nick })); }}/>`;
  return html`<${React.Fragment}>
    ${screen}
    <nav className="tabbar" aria-label="메뉴">${TABS.map(([k, l, ic]) => k === 'rec' ? html`<button key=${k} className="rectab" onClick=${() => startPlay(null)} aria-label="오늘 한 게임 기록하기"><span className="rc">${ic}</span><span>기록</span></button>` :
      html`<button key=${k} aria-current=${tab === k ? 'page' : undefined} onClick=${() => go(k)}>${ic}<span className=${k === 'me' ? 'tnk' : null}>${k === 'me' ? ME.name : l}</span></button>`)}</nav>
    ${sheet && sheet.kind === 'play' ? html`<${PlaySheet} key=${sheet.edit || 'new'} again=${sheet.again} st=${st} gameId=${sheet.id} editDate=${sheet.edit} close=${() => setSheet(null)} onSave=${savePlay} onDeleteDay=${deleteDay} saveDraft=${saveDraft} discardDraft=${discardDraft} addCustom=${addCustom} setRule=${setRule}/>` : null}
    ${sheet && sheet.kind === 'person' ? html`<${PersonSheet} st=${st} name=${sheet.name} close=${() => setSheet(null)} open=${open} linkFriend=${linkFriend} block=${block}/>` : null}
    ${sheet && sheet.kind === 'settings' ? html`<${SettingsSheet} st=${st} close=${() => setSheet(null)} setSettings=${setSettings} say=${say} resetTo=${resetTo}/>` : null}
    ${sheet && sheet.kind === 'char' ? html`<${CharSheet} st=${st} close=${() => setSheet(null)} onSave=${saveChar}/>` : null}
    ${sheet && sheet.kind === 'couple' ? html`<${CoupleSheet} st=${st} c=${sheet.c} close=${() => setSheet(null)} onSave=${saveCouple} onDelete=${delCouple}/>` : null}
    ${sheet && sheet.kind === 'newgroup' ? html`<${NewGroupSheet} st=${st} edit=${sheet.edit} close=${() => setSheet(null)} onCreate=${sheet.edit ? info => saveGroupInfo(sheet.edit.id, info) : createGroup}/>` : null}
    ${sheet && sheet.kind === 'what' ? html`<${WhatSheet} st=${st} allReviews=${allReviews} gid=${sheet.gid} who0=${sheet.who} close=${() => setSheet(null)} startPlay=${startPlay} update=${update} say=${say}/>` : null}
    ${qnaG && GAME[qnaG] ? html`<div className="qlayer" role="dialog" aria-modal="true" aria-label=${GAME[qnaG].ko + ' 규칙 질문'}><div className="ql-h"><b>${GAME[qnaG].ko} 규칙 질문</b><button className="btn" onClick=${() => setQnaG(null)}>기록으로 돌아가기</button></div><${GameQnA} id=${qnaG} st=${st} qa=${qa} say=${say} inLayer/></div>` : null}
    ${sheet && sheet.kind === 'saved' ? html`<${SavedSheet} st=${st} date=${sheet.date} plays=${sheet.plays} synced=${sheet.synced} editDay=${editDay} close=${() => setSheet(null)} share=${() => setSheet({ kind: 'share', date: sheet.date })} openCouple=${openCouple}/>` : null}
    ${sheet && sheet.kind === 'day' ? html`<${DaySheet} st=${st} date=${sheet.date} close=${() => setSheet(null)} open=${open} editDay=${editDay} shareDay=${shareDay} removeFromId=${removeFromId}/>` : null}
    ${sheet && sheet.kind === 'share' ? html`<${ShareDaySheet} st=${st} date=${sheet.date} close=${() => setSheet(null)} say=${say}/>` : null}
    ${sheet && sheet.kind === 'year' ? html`<${YearSheet} st=${st} close=${() => setSheet(null)} open=${open}/>` : null}
    ${sheet && sheet.kind === 'shelfimg' ? html`<${ShelfImageSheet} st=${st} close=${() => setSheet(null)} say=${say}/>` : null}
    ${sheet && sheet.kind === 'barcode' ? html`<${BarcodeSheet} st=${st} close=${() => setSheet(null)} toggleOwn=${toggleOwn}/>` : null}
    ${sheet && sheet.kind === 'review' ? html`<${ReviewSheet} st=${st} gameId=${sheet.id} close=${() => setSheet(null)} onSave=${saveReview} onDelete=${delReview}/>` : null}
    ${full ? html`<div className="toast" role="alert">저장 공간이 꽉 찼어요. 사진을 몇 장 빼주세요.</div>` : toast ? html`<div className="toast" role="status">${toast.m || toast}${toast.undo ? html`<button className="t-undo" onClick=${toast.undo}>되돌리기</button>` : null}</div>` : null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
})();
</script>

</body></html>
